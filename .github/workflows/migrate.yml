name: Migrate

on:
  push:
    branches: [main]

# Never let two runs apply migrations to the same database at once
concurrency:
  group: d1-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to gate prod migrations
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # drizzle-kit, matching the ledger prod already tracks in __drizzle_migrations.
      # Wrangler keeps a separate d1_migrations ledger and would see every migration as pending.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
        run: bun run db:migrate
